<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🛒 Product Dashboard</span>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
            Add Product
        </button>
    </div>
</nav>


<div class="container mt-4">
    <div class="card shadow">
        <div class="card-body">
            <h4 class="mb-3">All Products</h4>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Brand</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Warehouse</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 🔷 Modal -->
<div class="modal fade" id="productModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Add Product</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <form id="productForm">
          <input type="text" id="name" class="form-control mb-2" placeholder="Product Name" required>
          <input type="text" id="brand" class="form-control mb-2" placeholder="Brand" required>
          <input type="text" id="sku" class="form-control mb-2" placeholder="SKU" required>
          <input type="number" id="price" class="form-control mb-2" placeholder="Price" step="0.01" min="0" required>
          <input type="number" id="stock" class="form-control mb-2" placeholder="Stock" min="0" required>
          <input type="text" id="warehouse" class="form-control mb-2" placeholder="Warehouse" required>

          <button type="submit" class="btn btn-success w-100">Save Product</button>
        </form>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/script.js"></script>

</body>
</html>
